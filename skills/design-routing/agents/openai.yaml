interface:
  display_name: "Design Routing"
  short_description: "Design a UI end to end — brief, directions, build, review"
  default_prompt: "Use design-routing to take this brief through the full design process."

policy:
  # Implicit invocation is intentionally ENABLED. This skill is the entrance for
  # whole-interface design; the pack's second skill, design-system, has its own adapter
  # and its own triggers. The eighteen references of this skill (twenty-two in the pack) are
  # loaded per step and deliberately not exposed as skills, so no third door needs a guard.
  allow_implicit_invocation: true
